name: Deploy demo and docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build example site
        env:
          VITE_DOCS_BASE_URL: ${{ steps.pages.outputs.base_path }}/docs
        run: npm run build:demo

      - name: Build documentation site
        env:
          VITEPRESS_BASE: ${{ steps.pages.outputs.base_path }}/docs/
        run: npm run docs:build

      - name: Assemble Pages site
        run: |
          mkdir -p demo-dist/docs
          cp -a docs/.vitepress/dist/. demo-dist/docs/
          touch demo-dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: demo-dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
